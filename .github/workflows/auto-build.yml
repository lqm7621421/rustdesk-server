name: Auto Build Server (no-key)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/**"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Native build on Ubuntu: has system OpenSSL via libssl-dev, so no musl/cross
  # OpenSSL problems. Produces glibc-linked binaries for standard x86_64 servers.
  build-linux-amd64:
    name: Build - linux-amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "stable"
          override: true
          default: true
          profile: minimal

      - name: Install OpenSSL dev
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: cargo build --release --all-features

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp target/release/hbbs out/
          cp target/release/hbbr out/
          cp target/release/rustdesk-utils out/ 2>/dev/null || true
          chmod -v a+x out/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-linux-amd64
          path: out/*
          if-no-files-found: error

  # Windows x64 build via cross-compilation from Linux. Building on a Windows
  # host fails because sqlx-macros is a proc-macro DLL whose sqlite/lib sodium
  # CRT init fails there (os error 1114). Compiling on Linux makes proc-macros
  # run as .so and avoids that entirely. No --all-features => no native-tls/openssl.
  build-windows-amd64:
    name: Build - windows-amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "stable"
          override: true
          default: true
          profile: minimal
          target: x86_64-pc-windows-gnu

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --target x86_64-pc-windows-gnu

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp target/x86_64-pc-windows-gnu/release/hbbs.exe out/
          cp target/x86_64-pc-windows-gnu/release/hbbr.exe out/
          cp target/x86_64-pc-windows-gnu/release/rustdesk-utils.exe out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-windows-amd64
          path: out/*
          if-no-files-found: error
