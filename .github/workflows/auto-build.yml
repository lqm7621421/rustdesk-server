name: Auto Build Server (no-key)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/**"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Native build on Ubuntu: has system OpenSSL via libssl-dev, so no musl/cross
  # OpenSSL problems. Produces glibc-linked binaries for standard x86_64 servers.
  build-linux-amd64:
    name: Build - linux-amd64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "stable"
          override: true
          default: true
          profile: minimal

      - name: Install OpenSSL dev
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build
        run: cargo build --release --all-features

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp target/release/hbbs out/
          cp target/release/hbbr out/
          cp target/release/rustdesk-utils out/ 2>/dev/null || true
          chmod -v a+x out/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-linux-amd64
          path: out/*
          if-no-files-found: error

  # Windows x64 build. Uses use-cross (same as official build.yaml) to avoid the
  # sqlx-macros sqlite DLL load failure seen with plain cargo on windows runners.
  build-windows-amd64:
    name: Build - windows-amd64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "stable"
          override: true
          default: true
          profile: minimal
          target: x86_64-pc-windows-msvc

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=x86_64-pc-windows-msvc
          use-cross: true

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\hbbs.exe out\
          Copy-Item target\x86_64-pc-windows-msvc\release\hbbr.exe out\
          if (Test-Path target\x86_64-pc-windows-msvc\release\rustdesk-utils.exe) {
            Copy-Item target\x86_64-pc-windows-msvc\release\rustdesk-utils.exe out\
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-windows-amd64
          path: out/*
          if-no-files-found: error
